# Enable mouse support: click to select panes/windows, drag to resize, scroll to view history
set -g mouse on

# Let apps detect terminal focus in/out events — so Claude Code can
# fire notifications correctly (also used by vim/nvim and similar apps)
set -g focus-events on

# Increase scrollback buffer per pane from the default (2000) to 50000 lines
set -g history-limit 50000

# Start window numbering at 1 instead of 0 (0 is awkward to reach on keyboards)
set -g base-index 1
# Start pane numbering at 1 instead of 0, to match window numbering
setw -g pane-base-index 1

# Use vi-style keybindings in copy mode (enter copy mode with prefix + [):
# arrow keys (or h/j/k/l) to navigate, Space (or v) to start selection, Enter (or y) to copy
set-window-option -g mode-keys vi

# Remove default split bindings (" and %) since we're replacing them below
unbind '"'
unbind %

# Split window horizontally (side by side) with prefix + | , opening in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
# Split window vertically (stacked) with prefix + - , opening in the current pane's path
bind - split-window -v -c "#{pane_current_path}"

# Create a new window with prefix + c, opening in the current pane's path
# (this overrides the default binding, which is already 'c', but keeps the path behavior)
bind c new-window -c "#{pane_current_path}"

# Navigate panes with Alt+Arrow keys, no prefix needed (-n)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload this config file with prefix + r, and confirm with a status-bar message
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"